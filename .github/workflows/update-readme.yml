name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch GitHub stats and update README.md
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          token="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "No token available for GitHub API access"
            exit 1
          fi

          # Get stats from GitHub API
          CLONES=$(curl -fsS -H "Authorization: token $token" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/$repo/traffic/clones)
          VIEWS=$(curl -fsS -H "Authorization: token $token" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/$repo/traffic/views)
          META=$(curl -fsS -H "Authorization: token $token" https://api.github.com/repos/$repo)

          if echo "$CLONES" | jq -e '.message? != null' >/dev/null || \
             echo "$VIEWS" | jq -e '.message? != null' >/dev/null || \
             echo "$META" | jq -e '.message? != null' >/dev/null; then
            echo "GitHub API returned an error response"
            exit 1
          fi

          # Extract values
          CLONE_COUNT=$(echo "$CLONES" | jq -er '.count')
          UNIQUE_CLONE=$(echo "$CLONES" | jq -er '.uniques')
          VIEW_COUNT=$(echo "$VIEWS" | jq -er '.count')
          UNIQUE_VIEW=$(echo "$VIEWS" | jq -er '.uniques')
          STARS=$(echo "$META" | jq -er '.stargazers_count')
          FORKS=$(echo "$META" | jq -er '.forks_count')
          UPDATED=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          # Replace table values in README.md
          sed -i "s|<!--CLONE_COUNT-->.*|<!--CLONE_COUNT--> $CLONE_COUNT |" README.md
          sed -i "s|<!--UNIQUE_CLONE-->.*|<!--UNIQUE_CLONE--> $UNIQUE_CLONE |" README.md
          sed -i "s|<!--VIEW_COUNT-->.*|<!--VIEW_COUNT--> $VIEW_COUNT |" README.md
          sed -i "s|<!--UNIQUE_VIEWS-->.*|<!--UNIQUE_VIEWS--> $UNIQUE_VIEW |" README.md
          sed -i "s|<!--STARS-->.*|<!--STARS--> $STARS |" README.md
          sed -i "s|<!--FORKS-->.*|<!--FORKS--> $FORKS |" README.md
          sed -i "s|<!--LAST_UPDATED-->.*|<!--LAST_UPDATED--> $UPDATED |" README.md

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "No token available for git push"
            exit 1
          fi

          git config user.name "djambred"
          git config user.email "djambred@users.noreply.github.com"

          # Set origin remote with token for authenticated push
          git remote set-url origin https://x-access-token:${token}@github.com/${{ github.repository }}

          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "🔄 Update GitHub stats in README"
          git push origin HEAD
